<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قسم الرياضيات - مدرسة بلال بن رباح للبنين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef8f0; --card:#ffffff; --text:#1a2e20; --muted:#5c7268;
  --primary:#1f7a4c; --primary2:#4caf6b; --ok:#1f9d55; --bad:#b23a3a; --warn:#e08a1f; --border:#d7ecdd;
  --header-text:#fdf6e3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10131c;--card:#1a1e2b;--text:#eef0f6;--muted:#9aa0b4;--border:#2a2f40;}
}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1e2b;--text:#eef0f6;--muted:#9aa0b4;--border:#2a2f40;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);}
header{background:radial-gradient(circle at 50% 22%, #2f9463 0%, #1c5c3d 45%, #0e2f1f 100%);color:#fff;padding:28px 16px 18px;text-align:center;position:relative;overflow:hidden;}
header img.logo{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:50%;padding:6px;box-shadow:0 0 0 10px rgba(255,255,255,.06), 0 0 30px 8px rgba(120,220,160,.55);animation:logoSpinOnce 1.4s ease-out 1;}
@keyframes logoSpinOnce{ from{transform:rotate(0deg) scale(.6);opacity:0;} to{transform:rotate(360deg) scale(1);opacity:1;} }
header h1{margin:16px 0 2px;font-size:1.5rem;font-weight:900;color:#f2c230;}
header p{margin:0 0 6px;opacity:1;font-size:1rem;color:#ffffff;font-weight:700;}
.app-sub{margin:0 0 10px;font-size:.82rem;color:#f2c230;font-weight:700;letter-spacing:.3px;}
.marquee{overflow:hidden;white-space:nowrap;position:relative;border-top:1px solid rgba(255,255,255,.2);padding-top:6px;}
.marquee span{display:inline-block;padding-inline-end:60px;font-size:.76rem;opacity:.95;animation:scroll 18s linear infinite;color:#fff;font-weight:700;}
@keyframes scroll{ from{transform:translateX(100%);} to{transform:translateX(-100%);} }
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
nav button{flex:0 0 auto;padding:8px 14px;border-radius:18px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-weight:700;cursor:pointer;font-size:.85rem;}
nav button.active{background:var(--primary);color:var(--header-text);border-color:var(--primary);}
main{max-width:800px;margin:0 auto;padding:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.card h2{margin:0 0 10px;font-size:1.05rem;}
label{font-weight:700;font-size:.88rem;display:block;margin-bottom:4px;}
input[type=date],input[type=text],input[type=month],select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;margin-bottom:12px;}
.teacher-list{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px;max-height:260px;overflow-y:auto;padding-inline-end:4px;}
.teacher-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;}
.teacher-item input{width:18px;height:18px;}
.btn{padding:11px 20px;border-radius:9px;border:none;background:var(--primary);color:var(--header-text);font-family:inherit;font-weight:800;cursor:pointer;font-size:.9rem;width:100%;margin-top:4px;}
.btn.secondary{background:var(--bad);color:#fff;}
.btn.small{width:auto;padding:8px 14px;font-size:.82rem;}
.overflow-x{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:520px;}
th,td{border:1px solid var(--border);padding:7px 8px;text-align:center;}
th{background:var(--bg);}
tr.assigned td.sub{color:var(--ok);font-weight:800;}
tr.unassigned td.sub{color:var(--bad);font-weight:800;}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:700;}
.pill.ok{background:rgba(31,157,85,.15);color:var(--ok);}
.muted{color:var(--muted);font-size:.8rem;}
.sched-grid input{min-width:64px;padding:5px;font-size:.75rem;margin-bottom:0;text-align:center;}
.sched-grid table{min-width:640px;}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0;}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:18px;}
</style>
</head>

const GNAME = {5:'الخامس',6:'السادس',7:'السابع',8:'الثامن',9:'التاسع',10:'العاشر',11:'الحادي عشر',12:'الثاني عشر'};

const DEFAULT_TEACHERS = [
 {id:1,name:'بدر هلال سالم الندابي',role:'المعلم الأول',sched:[d('12/1,.,.,.,.,.,.,.'),d('.,.,12/1,.,.,.,.,.'),d('.,.,.,.,.,.,.,12/1'),d('.,.,.,12/1,12/1,.,.,.'),d('.,.,.,.,12/1,.,.,.')]},

 {id:8,name:'أحمد سيد محمد سيد',role:'',sched:[d('12/5,.,.,7/4,.,12/4,.,7/4'),d('12/4,.,7/4,.,.,12/5,.,12/5'),d('12/5,.,7/4,.,.,.,12/4,.'),d('7/4,12/5,.,7/4,.,12/4,.,.'),d('7/4,.,.,12/4,.,.,12/5,12/4')]},
 {id:9,name:'سفيان بن مسعود حمداني',role:'',sched:[d('.,5/1,.,5/3,.,5/2,5/3,.'),d('5/2,.,5/3,.,5/1,5/2,.,.'),d('.,5/1,5/3,.,5/1,.,5/2,.'),d('5/2,.,5/1,5/2,.,5/1,.,5/3'),d('5/2,5/1,.,5/3,.,.,.,5/3')]},
 {id:10,name:'عصام البوصيري زروق',role:'',sched:[d('.,.,8/1,8/2,.,8/3,8/3,.'),d('8/1,.,8/2,8/2,.,8/1,8/3,.'),d('8/2,.,.,.,8/1,8/3,.,8/1'),d('.,8/1,.,.,8/3,8/3,.,8/2'),d('8/2,.,8/1,.,8/3,.,.,8/2')]},
 {id:11,name:'محمود (الرياضيات)',role:'',sched:[d('6/3,6/1,.,6/2,.,6/3,.,.'),d('.,.,6/2,.,6/1,6/1,.,6/3'),d('6/3,6/2,.,6/1,.,6/2,.,.'),d('.,.,6/3,6/3,.,6/1,.,6/2'),d('.,6/3,.,6/2,6/1,.,6/2,6/1')]},
 {id:12,name:'سيف الدين خلف الله',role:'',sched:[d('.,.,11/4,.,11/1,.,.,11/3'),d('.,.,11/3,.,11/4,.,.,11/1'),d('11/4,.,11/3,11/1,.,.,11/1,.'),d('11/3,11/1,.,.,11/3,11/4,.,.'),d('.,11/1,11/4,.,.,11/3,.,11/4')]}
];

function loadTeachers(){
  try{ const s = localStorage.getItem('teachers_data'); if(s){ const parsed = JSON.parse(s); if(Array.isArray(parsed) && parsed.length) return parsed; } }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TEACHERS));
}
function saveTeachers(){ try{ localStorage.setItem('teachers_data', JSON.stringify(teachers)); }catch(e){} }
let teachers = loadTeachers();

function weeklyLoad(t){ let n=0; t.sched.forEach(day=>day.forEach(c=>{if(c!=='.')n++;})); return n; }
function gradesOf(t){ const set=new Set(); t.sched.forEach(day=>day.forEach(c=>{if(c!=='.')set.add(c.split('/')[0]);})); return [...set].sort((a,b)=>a-b).map(g=>GNAME[g]||g).join('، ')||'—'; }

function newRecId(){ return 'r'+Date.now()+Math.random().toString(36).slice(2,7); }
function loadRecords(){
  try{
    const arr = JSON.parse(localStorage.getItem('sub_records')||'[]');
    let changed=false;
    arr.forEach(r=>{ if(!r.id){ r.id = newRecId(); changed=true; } });
    if(changed) saveRecords(arr);
    return arr;
  }catch(e){ return []; }
}
function saveRecords(r){ try{ localStorage.setItem('sub_records', JSON.stringify(r)); }catch(e){} }

function monthKey(dateStr){ return dateStr.slice(0,7); }
function weekdayIndex(dateStr){ const dt = new Date(dateStr+'T00:00:00'); const wd = dt.getDay(); return wd<=4 ? wd : -1; }
function weekKeyOf(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  const wd = dt.getDay();
  const start = new Date(dt);
  start.setDate(dt.getDate() - (wd<=4 ? wd : 0));
  return start.toISOString().slice(0,10);
}

function showToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2210;color:#fff;padding:10px 18px;border-radius:20px;font-size:.85rem;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90%;text-align:center;';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function showConfirm(message, onYes){
  const overlay = document.createElement('div');

  overlay.innerHTML = `<div style="background:var(--card);color:var(--text);border-radius:14px;padding:20px;max-width:320px;width:100%;text-align:center;">
     <p style="margin:0 0 16px;font-weight:700;">${message}</p>
     <div style="display:flex;gap:10px;">
       <button id="confYes" class="btn" style="margin:0;">نعم، متابعة</button>
       <button id="confNo" class="btn secondary" style="margin:0;">إلغاء</button>
     </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#confYes').onclick = ()=>{ overlay.remove(); onYes(); };
  overlay.querySelector('#confNo').onclick = ()=> overlay.remove();
}

const nav = document.getElementById('nav');
const main = document.getElementById('main');
const tabs = [['absence','تسجيل غياب وتوزيع'],['stats','الإحصائيات'],['log','سجل الاحتياط'],['settings','⚙️ الإعدادات']];
tabs.forEach(([id,label])=>{
  const b=document.createElement('button'); b.textContent=label; b.id='nav-'+id; b.onclick=()=>showTab(id); nav.appendChild(b);
});

function showTab(id){
  tabs.forEach(([tid])=>document.getElementById('nav-'+tid).classList.toggle('active', tid===id));
  if(id==='absence') renderAbsence();
  if(id==='stats') renderStats();
  if(id==='log') renderLog();
  if(id==='settings') renderSettings();
}

function renderAbsence(){
  const today = new Date().toISOString().slice(0,10);
  main.innerHTML = `
  <div class="card">
    <h2>1) اختر التاريخ والمعلمين الغائبين</h2>
    <label>التاريخ</label>
    <input type="date" id="absDate" value="${today}">
    <div id="dayWarn" class="muted"></div>
    <label>المعلمون الغائبون</label>
    <div class="teacher-list">
      ${teachers.map(t=>`<label class="teacher-item"><input type="checkbox" value="${t.id}" class="absChk"> ${t.name} ${t.role?'('+t.role+')':''}</label>`).join('')}
    </div>
    <label>طريقة التوزيع</label>
    <div style="display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:.88rem;"><input type="radio" name="distMode" value="auto" checked style="width:18px;height:18px;"> آلي (لمرة واحدة فقط)</label>
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:.88rem;"><input type="radio" name="distMode" value="manual" style="width:18px;height:18px;"> يدوي (تختار البديل بنفسك)</label>
    </div>
    <button class="btn" onclick="startDistribution()">متابعة</button>
  </div>
  <div id="assignResult"></div>
  `;
  document.getElementById('absDate').addEventListener('change', checkWeekend);
  checkWeekend();
}
function checkWeekend(){
  const val = document.getElementById('absDate').value;
  const w = weekdayIndex(val);
  document.getElementById('dayWarn').textContent = w===-1 ? '⚠️ هذا اليوم عطلة نهاية أسبوع (لا يوجد دوام)' : 'اليوم: '+DAYS[w];
}

function startDistribution(){
  const dateVal = document.getElementById('absDate').value;
  const wd = weekdayIndex(dateVal);
  const resultDiv = document.getElementById('assignResult');
  if(!dateVal || wd===-1){ resultDiv.innerHTML = '<div class="card">اختر تاريخاً ضمن أيام الدوام (الأحد-الخميس).</div>'; return; }
  const absentIds = [...document.querySelectorAll('.absChk:checked')].map(c=>+c.value);
  if(absentIds.length===0){ resultDiv.innerHTML = '<div class="card">اختر معلماً واحداً على الأقل.</div>'; return; }
  const mode = document.querySelector('input[name="distMode"]:checked').value;
  if(mode==='auto') runAssign(dateVal, wd, absentIds);
  else renderManualForm(dateVal, wd, absentIds);
}

function runAssign(dateVal, wd, absentIds){
  const resultDiv = document.getElementById('assignResult');
  const records = loadRecords();
  const mKey = monthKey(dateVal);
  const wKey = weekKeyOf(dateVal);
  const WEEKLY_CAP = 2;

  // القفل: أي معلم غائب سبق توزيعه آلياً في هذا التاريخ لا يُعاد توزيعه آلياً مرة أخرى أبداً (لضمان العدالة)
  const lockedIds = new Set(records.filter(r=> r.date===dateVal && r.source!=='manual').map(r=>r.absentId));
  const toProcess = absentIds.filter(id=>!lockedIds.has(id));
  const alreadyDone = absentIds.filter(id=>lockedIds.has(id));

  // عدّادات العدالة: حصص هذا الأسبوع، حصص ثامنة هذا الأسبوع، حصص اليوم نفسه (من أي سجل سابق + توزيعات هذا التشغيل)
  const weekCount = {}, eighthCount = {}, dayCount = {};
  teachers.forEach(t=>{ weekCount[t.id]=0; eighthCount[t.id]=0; dayCount[t.id]=0; });
  records.forEach(r=>{
    if(weekKeyOf(r.date)===wKey){
      weekCount[r.subId] = (weekCount[r.subId]||0)+1;
      if(+r.period===8) eighthCount[r.subId] = (eighthCount[r.subId]||0)+1;
    }
    if(r.date===dateVal) dayCount[r.subId] = (dayCount[r.subId]||0)+1;
  });

  // منع تعارض الحصص: أي معلم أُسنِد كبديل في هذا التاريخ لهذه الحصة (من أي توزيع سابق) لا يُختار مرة أخرى لنفس الحصة
  const usedPeriod = Array.from({length:8}, ()=> new Set());
  records.filter(r=>r.date===dateVal).forEach(r=> usedPeriod[r.period-1].add(r.subId));

  const rankFn = (a,b)=>
    (dayCount[a.id]-dayCount[b.id]) ||
    (weekCount[a.id]-weekCount[b.id]) ||
    (weeklyLoad(a)-weeklyLoad(b)) ||
    a.name.localeCompare(b.name,'ar');

  const rows = [];
  const newRecords = [];

  for(let p=0; p<8; p++){
    toProcess.forEach(aid=>{
      const at = teachers.find(t=>t.id===aid);
      const cls = at.sched[wd][p];
      if(cls==='.') return;

      let pool = teachers.filter(t=>
        t.id!==aid && !absentIds.includes(t.id) && !usedPeriod[p].has(t.id) && t.sched[wd][p]==='.');

      // سقف حصتين احتياط أسبوعياً — لا يُتجاوز إلا إذا لم يتبقَّ أي بديل آخر
      let underCap = pool.filter(t=> weekCount[t.id] < WEEKLY_CAP);
      let overCap = underCap.length===0 && pool.length>0;
      pool = underCap.length ? underCap : pool;

      // عدالة الحصة الثامنة: لا يُمنح المعلم أكثر من حصة ثامنة واحدة أسبوعياً — إلا عند الضرورة القصوى
      let overEighth = false;
      if(p===7){
        const noEighth = pool.filter(t=> eighthCount[t.id] < 1);
        overEighth = noEighth.length===0 && pool.length>0;
        pool = noEighth.length ? noEighth : pool;
      }

      pool.sort(rankFn);
      const chosen = pool[0];
      if(chosen){
        usedPeriod[p].add(chosen.id);
        weekCount[chosen.id] = (weekCount[chosen.id]||0)+1;
        dayCount[chosen.id] = (dayCount[chosen.id]||0)+1;
        if(p===7) eighthCount[chosen.id] = (eighthCount[chosen.id]||0)+1;
        newRecords.push({id:newRecId(), date:dateVal, month:mKey, week:wKey, day:DAYS[wd], period:p+1, class:fmt(cls), absentId:at.id, absentName:at.name, subId:chosen.id, subName:chosen.name, source:'auto'});
        let note = '';
        if(overCap) note += ' ⚠ تجاوز حد حصتين/أسبوع (لا يوجد بديل آخر)';
        if(overEighth) note += ' ⚠ حصة ثامنة إضافية (لا يوجد بديل آخر)';
        rows.push({period:p+1, absent:at.name, cls:fmt(cls), sub:chosen.name+note, ok:true, locked:false});
      } else {
        rows.push({period:p+1, absent:at.name, cls:fmt(cls), sub:'لا يوجد معلم متاح', ok:false, locked:false});
      }
    });
  }

  // نعرض أيضاً التوزيع المحفوظ سابقاً (للقراءة فقط) لأي معلم كان مقفولاً
  alreadyDone.forEach(aid=>{
    records.filter(r=>r.date===dateVal && r.absentId===aid).forEach(r=>{
      rows.push({period:r.period, absent:r.absentName, cls:r.class, sub:r.subName, ok:true, locked:true});
    });
  });

  if(rows.length===0){
    resultDiv.innerHTML = '<div class="card">لا توجد حصص لهذا المعلم في يوم '+DAYS[wd]+'.</div>';
    return;
  }

  saveRecords(records.concat(newRecords));
  rows.sort((a,b)=> a.period-b.period || a.absent.localeCompare(b.absent,'ar'));

  let noticeHtml = '';
  if(alreadyDone.length){
    const names = alreadyDone.map(id=> (teachers.find(t=>t.id===id)||{}).name).join('، ');
    noticeHtml = `<p class="muted">🔒 تم توزيع هذا اليوم آلياً من قبل لـ: ${names} — لن يُعاد التوزيع لهم مرة أخرى حفاظاً على العدالة (المعروض أدناه هو نفس التوزيع المحفوظ سابقاً). لإعادة توزيعه فعلاً يجب حذفه أولاً من تبويب سجل الاحتياط.</p>`;
  }

  resultDiv.innerHTML = `
  <div class="card">
    <h2>نتيجة التوزيع الآلي — ${DAYS[wd]} ${dateVal}</h2>
    ${noticeHtml}
    <div class="overflow-x"><table>
      <tr><th>الحصة</th><th>المعلم الغائب</th><th>الصف</th><th>المعلم البديل</th></tr>
      ${rows.map(r=>`<tr class="${r.ok?'assigned':'unassigned'}"><td>${r.period}</td><td>${r.absent}</td><td>${r.cls}</td><td class="sub">${r.sub}${r.locked?' 🔒':''}</td></tr>`).join('')}
    </table></div>
    <p class="muted">يراعي التوزيع الآلي: أقل حمل فعلي أسبوعي، أقل عدد حصص احتياط اليوم والأسبوع، حد أقصى حصتان احتياط أسبوعياً لكل معلم، وعدم منح أكثر من حصة ثامنة واحدة أسبوعياً لنفس المعلم (إلا عند عدم وجود بديل آخر، ويظهر ذلك بعلامة ⚠).</p>
  </div>`;
}

/* ===== التوزيع اليدوي ===== */
function renderManualForm(dateVal, wd, absentIds){
  const resultDiv = document.getElementById('assignResult');
  const mKey = monthKey(dateVal);
  const needed = [];
  absentIds.forEach(aid=>{
    const at = teachers.find(t=>t.id===aid);
    for(let p=0;p<8;p++){ if(at.sched[wd][p]!=='.') needed.push({absentId:aid, absentName:at.name, period:p, cls:at.sched[wd][p]}); }
  });
  if(needed.length===0){ resultDiv.innerHTML = '<div class="card">لا توجد حصص لهذا المعلم في يوم '+DAYS[wd]+'.</div>'; return; }

  const records = loadRecords();
  const monthCount = {}; teachers.forEach(t=>monthCount[t.id]=0);
  records.filter(r=>r.month===mKey).forEach(r=>{ monthCount[r.subId]=(monthCount[r.subId]||0)+1; });

  window._manualNeeded = needed;
  window._manualCtx = {dateVal, wd, mKey};

  resultDiv.innerHTML = `
  <div class="card">
    <h2>توزيع يدوي — ${DAYS[wd]} ${dateVal}</h2>
    <p class="muted">الرقم بين قوسين أمام كل اسم = عدد حصص الاحتياط لهذا المعلم هذا الشهر (للمساعدة على العدالة).</p>
    <div class="overflow-x"><table>
      <tr><th>الحصة</th><th>الغائب</th><th>الصف</th><th>المعلم البديل</th></tr>
      ${needed.map((n,i)=>{
        const free = teachers.filter(t=> t.id!==n.absentId && !absentIds.includes(t.id) && t.sched[wd][n.period]==='.');
        free.sort((a,b)=> (monthCount[a.id]-monthCount[b.id]) || a.name.localeCompare(b.name,'ar'));
        const opts = free.map(t=>`<option value="${t.id}">${t.name} (${monthCount[t.id]||0})</option>`).join('');
        return `<tr><td>${n.period+1}</td><td>${n.absentName}</td><td>${fmt(n.cls)}</td>
          <td><select data-idx="${i}" class="manualSel"><option value="">— اختر —</option>${opts}</select></td></tr>`;
      }).join('')}
    </table></div>
    <button class="btn" onclick="saveManual()">حفظ التوزيع اليدوي</button>
  </div>`;
}
function saveManual(){
  const needed = window._manualNeeded || [];
  const {dateVal, wd, mKey} = window._manualCtx || {};
  if(!needed.length) return;
  let records = loadRecords();
  records = records.filter(r=> !(r.date===dateVal && needed.some(n=>n.absentId===r.absentId)));
  const rows = []; const newRecords = [];
  document.querySelectorAll('.manualSel').forEach(sel=>{
    const idx = +sel.dataset.idx; const n = needed[idx];
    const subId = sel.value ? +sel.value : null;
    const sub = subId ? teachers.find(t=>t.id===subId) : null;
    const cls = fmt(n.cls);
    if(sub){
      newRecords.push({id:newRecId(), date:dateVal, month:mKey, day:DAYS[wd], period:n.period+1, class:cls, absentId:n.absentId, absentName:n.absentName, subId:sub.id, subName:sub.name, source:'manual'});
      rows.push({period:n.period+1, absent:n.absentName, cls, sub:sub.name, ok:true});
    } else {
      rows.push({period:n.period+1, absent:n.absentName, cls, sub:'لم يُحدد', ok:false});
    }
  });
  saveRecords(records.concat(newRecords));
  rows.sort((a,b)=> a.period-b.period || a.absent.localeCompare(b.absent,'ar'));
  document.getElementById('assignResult').innerHTML = `
  <div class="card">
    <h2>تم حفظ التوزيع اليدوي — ${DAYS[wd]} ${dateVal}</h2>
    <div class="overflow-x"><table>
      <tr><th>الحصة</th><th>الغائب</th><th>الصف</th><th>البديل</th></tr>
      ${rows.map(r=>`<tr class="${r.ok?'assigned':'unassigned'}"><td>${r.period}</td><td>${r.absent}</td><td>${r.cls}</td><td class="sub">${r.sub}</td></tr>`).join('')}
    </table></div>
  </div>`;
  showToast('تم حفظ التوزيع اليدوي');
}

function renderStats(){
  const now = new Date().toISOString().slice(0,7);
  main.innerHTML = `
  <div class="card">
    <label>الشهر</label>
    <input type="month" id="statMonth" value="${now}" onchange="renderStatsTable()">
  </div>
  <div id="statsTable"></div>`;
  renderStatsTable();
}
function renderStatsTable(){
  const mKey = document.getElementById('statMonth').value;
  const records = loadRecords().filter(r=>r.month===mKey);
  const count = {}; teachers.forEach(t=>count[t.id]=0);
  records.forEach(r=>count[r.subId]=(count[r.subId]||0)+1);
  document.getElementById('statsTable').innerHTML = `
  <div class="card overflow-x">
    <table>
      <tr><th>المعلم</th><th>الصفوف التي يدرسها</th><th>الحصص الفعلية أسبوعياً</th><th>حصص الاحتياط هذا الشهر</th></tr>
      ${teachers.map(t=>`<tr><td>${t.name}</td><td>${gradesOf(t)}</td><td>${weeklyLoad(t)}</td><td><span class="pill ${count[t.id]>0?'ok':''}">${count[t.id]||0}</span></td></tr>`).join('')}
    </table>
  </div>`;
}

function renderLog(){
  const records = loadRecords().slice().reverse();
  const today = new Date().toISOString().slice(0,10);
  const thisMonth = new Date().toISOString().slice(0,7);
  main.innerHTML = `
  <div class="card">
    <h2>🖨️ تصدير السجل للطباعة</h2>
    <p class="muted">يتم تنزيل ملف تقرير منسّق يمكنك فتحه وطباعته من متصفح جهازك مباشرة.</p>
    <label>تقرير يوم محدد</label>
    <div style="display:flex;gap:8px;">
      <input type="date" id="printDate" value="${today}" style="flex:1">
      <button class="btn small" style="flex:0 0 auto" onclick="printDaily()">تنزيل التقرير اليومي</button>
    </div>
    <hr class="sep">
    <label>تقرير شهر محدد</label>
    <div style="display:flex;gap:8px;">
      <input type="month" id="printMonth" value="${thisMonth}" style="flex:1">
      <button class="btn small" style="flex:0 0 auto" onclick="printMonthly()">تنزيل التقرير الشهري</button>
    </div>
  </div>
  <div class="card">
    <h2>🗑️ حذف توزيع معلم في تاريخ محدد</h2>
    <p class="muted">يحذف كل حصص هذا المعلم في هذا التاريخ فقط، ويسمح بإعادة توزيعه آلياً من جديد.</p>
    <label>التاريخ</label>
    <input type="date" id="delDate" value="${today}">
    <label>المعلم</label>
    <select id="delTeacher">${teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
    <button class="btn secondary" onclick="deleteByDateTeacher()">حذف توزيع هذا المعلم في هذا التاريخ</button>
  </div>
  <div class="card">
    <h2>سجل الاحتياط الكامل</h2>
    ${records.length===0?'<p class="muted">لا توجد سجلات بعد.</p>':`
    <div class="overflow-x"><table>
      <tr><th>التاريخ</th><th>اليوم</th><th>الحصة</th><th>الصف</th><th>الغائب</th><th>البديل</th><th></th></tr>
      ${records.map(r=>`<tr><td>${r.date}</td><td>${r.day}</td><td>${r.period}</td><td>${r.class}</td><td>${r.absentName}</td><td>${r.subName}</td><td><button class="btn small secondary" style="padding:5px 10px;margin:0;" onclick="deleteOneRecord('${r.id}')">حذف</button></td></tr>`).join('')}
    </table></div>`}
    <button class="btn secondary" style="margin-top:12px" onclick="clearAllRecords()">مسح كل السجلات</button>
  </div>`;
}
function deleteOneRecord(id){
  showConfirm('حذف هذا السجل؟', ()=>{
    const records = loadRecords().filter(r=>r.id!==id);
    saveRecords(records);
    showToast('تم حذف السجل');
    renderLog();
  });
}
function deleteByDateTeacher(){
  const date = document.getElementById('delDate').value;
  const id = +document.getElementById('delTeacher').value;
  if(!date){ showToast('اختر تاريخاً'); return; }
  const t = teachers.find(x=>x.id===id);
  const existing = loadRecords().filter(r=> r.date===date && r.absentId===id);
  if(existing.length===0){ showToast('لا يوجد توزيع محفوظ لهذا المعلم في هذا التاريخ'); return; }
  showConfirm('حذف كل توزيع '+(t?t.name:'')+' في '+date+'؟ سيصبح بإمكانك توزيعه آلياً من جديد.', ()=>{
    const records = loadRecords().filter(r=> !(r.date===date && r.absentId===id));
    saveRecords(records);
    showToast('تم الحذف');
    renderLog();
  });
}

async function getDownloadsCap(){
  try{
    if(!window.claude || !window.claude.use) return null;
    return await window.claude.use('downloads');
  }catch(e){ return null; }
}

function buildReportDoc(title, subtitle, rows){
  const trs = rows.length ? rows.map(r=>`<tr><td>${r.date}</td><td>${r.day}</td><td>${r.period}</td><td>${r.class}</td><td>${r.absentName}</td><td>${r.subName}</td><td></td></tr>`).join('') : '<tr><td colspan="7">لا توجد سجلات في هذه الفترة</td></tr>';
  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${title}</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;padding:20px;color:#222;}
    h2{text-align:center;margin:4px 0;}
    p{text-align:center;margin:0 0 16px;font-size:14px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{border:1px solid #333;padding:7px;text-align:center;}
    th{background:#f0e2c8;}
  </style></head><body>
  <h2>مدرسة بلال بن رباح للبنين — قسم الرياضيات</h2>
  <p>${title}<br>${subtitle}</p>
  <table>
    <tr><th>التاريخ</th><th>اليوم</th><th>الحصة</th><th>الصف</th><th>المعلم الغائب</th><th>المعلم البديل</th><th>توقيع البديل</th></tr>
    ${trs}
  </table>
  </body></html>`;
}

function showReport(title, subtitle, rows, filename){
  const trsHtml = rows.length ? rows.map(r=>`<tr><td>${r.date}</td><td>${r.day}</td><td>${r.period}</td><td>${r.class}</td><td>${r.absentName}</td><td>${r.subName}</td><td></td></tr>`).join('') : '<tr><td colspan="7">لا توجد سجلات في هذه الفترة</td></tr>';
  window._reportData = {title, subtitle, rows, filename};
  main.innerHTML = `
  <div class="card">
    <button class="btn small" onclick="showTab('log')">⬅ رجوع لسجل الاحتياط</button>
  </div>
  <div class="card" id="reportView">
    <h2 style="text-align:center">مدرسة بلال بن رباح للبنين — قسم الرياضيات</h2>
    <p class="muted" style="text-align:center">${title}<br>${subtitle}</p>
    <div class="overflow-x"><table>
      <tr><th>التاريخ</th><th>اليوم</th><th>الحصة</th><th>الصف</th><th>الغائب</th><th>البديل</th><th>توقيع البديل</th></tr>
      ${trsHtml}
    </table></div>
    <div id="dlStatus" class="muted" style="margin-top:10px;text-align:center;">جارٍ تجهيز التنزيل...</div>
    <button class="btn" onclick="downloadReport()">⬇️ تنزيل الملف</button>
  </div>`;
  downloadReport();
}
async function downloadReport(){
  const {title, subtitle, rows, filename} = window._reportData || {};
  if(!rows) return;
  const statusEl = document.getElementById('dlStatus');
  const doc = buildReportDoc(title, subtitle, rows);
  const dl = await getDownloadsCap();
  if(dl){
    try{
      await dl.save({filename, data: doc});
      if(statusEl) statusEl.textContent = 'تم التنزيل — افتح الملف من إشعارات جهازك أو مجلد التنزيلات لعرضه وطباعته.';
      showToast('تم تنزيل الملف');
      return;
    }catch(e){ /* fall through */ }
  }
  if(statusEl) statusEl.textContent = 'تعذّر التنزيل التلقائي هنا. التقرير معروض بالأعلى ويمكنك تصويره أو نسخه.';
}
function clearAllRecords(){
  showConfirm('هل تريد مسح كل سجلات الاحتياط؟ لا يمكن التراجع عن هذا.', ()=>{
    try{ localStorage.removeItem('sub_records'); }catch(e){}
    showToast('تم مسح السجل بالكامل');
    renderLog();
  });
}
function printDaily(){
  const val = document.getElementById('printDate').value;
  if(!val){ showToast('اختر تاريخاً'); return; }
  const rows = loadRecords().filter(r=>r.date===val).sort((a,b)=>a.period-b.period);
  showReport('تقرير يومي لتوزيع الحصص الاحتياطي', 'تاريخ: '+val, rows, 'تقرير-يومي-'+val+'.html');
}
function printMonthly(){
  const val = document.getElementById('printMonth').value;
  if(!val){ showToast('اختر شهراً'); return; }
  const rows = loadRecords().filter(r=>r.month===val).sort((a,b)=> a.date.localeCompare(b.date) || a.period-b.period);
  showReport('تقرير شهري لتوزيع الحصص الاحتياطي', 'شهر: '+val, rows, 'تقرير-شهري-'+val+'.html');
}

/* ===== الإعدادات ===== */
function renderSettings(){
  main.innerHTML = `
  <div class="card">
    <h2>➕ إضافة معلم جديد</h2>
    <label>اسم المعلم</label>
    <input type="text" id="newName" placeholder="مثال: سالم بن راشد">
    <label>الصفة (اختياري)</label>
    <input type="text" id="newRole" placeholder="مثال: معلم رياضيات">
    <button class="btn" onclick="addTeacher()">إضافة المعلم</button>
  </div>

  <div class="card">
    <h2>✏️ تعديل اسم / حذف معلم</h2>
    <label>اختر المعلم</label>
    <select id="editSelect" onchange="loadEditName()">${teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
    <label>الاسم الجديد</label>
    <input type="text" id="editName">
    <button class="btn" onclick="saveTeacherName()">حفظ الاسم</button>
    <button class="btn secondary" onclick="deleteTeacher()">حذف هذا المعلم</button>
  </div>

  <div class="card">
    <h2>🗓️ تعديل الجدول الأسبوعي لمعلم</h2>
    <label>اختر المعلم</label>
    <select id="schedSelect" onchange="renderSchedGrid()">${teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
    <p class="muted">اكتب رمز الصف/الشعبة بالصيغة رقم_الصف/رقم_الشعبة مثل 7/2 — واترك الخانة فارغة إن كانت الحصة فاضية.</p>
    <div id="schedGrid" class="sched-grid overflow-x"></div>
    <button class="btn" onclick="saveSchedGrid()">حفظ الجدول</button>
  </div>

  <div class="card">
    <h2>↩️ استعادة الإعدادات الافتراضية</h2>
    <p class="muted">يعيد كل المعلمين والجداول إلى الحالة الأصلية (لا يمسح سجل الاحتياط).</p>
    <button class="btn secondary" onclick="restoreDefaults()">استعادة الافتراضي</button>
  </div>
  `;
  loadEditName();
  renderSchedGrid();
}
function restoreDefaults(){
  showConfirm('استعادة كل الجداول الافتراضية؟ ستفقد أي تعديلات يدوية.', ()=>{
    teachers = JSON.parse(JSON.stringify(DEFAULT_TEACHERS));
    saveTeachers();
    showToast('تم استعادة الإعدادات الافتراضية');
    renderSettings();
  });
}
function loadEditName(){
  const id = +document.getElementById('editSelect').value;
  const t = teachers.find(x=>x.id===id);
  document.getElementById('editName').value = t ? t.name : '';
}
function saveTeacherName(){
  const id = +document.getElementById('editSelect').value;
  const t = teachers.find(x=>x.id===id);
  const val = document.getElementById('editName').value.trim();
  if(!val){ showToast('اكتب اسماً صحيحاً'); return; }
  t.name = val; saveTeachers(); showToast('تم حفظ الاسم'); renderSettings();
}
function deleteTeacher(){
  const id = +document.getElementById('editSelect').value;
  showConfirm('هل تريد حذف هذا المعلم نهائياً من القائمة؟', ()=>{
    teachers = teachers.filter(t=>t.id!==id);
    saveTeachers();
    showToast('تم حذف المعلم');
    renderSettings();
  });
}
function addTeacher(){
  const name = document.getElementById('newName').value.trim();
  const role = document.getElementById('newRole').value.trim();
  if(!name){ showToast('اكتب اسم المعلم'); return; }
  const newId = (teachers.length ? Math.max(...teachers.map(t=>t.id)) : 0) + 1;
  const emptySched = [0,1,2,3,4].map(()=>['.','.','.','.','.','.','.','.']);
  teachers.push({id:newId, name, role, sched:emptySched});
  saveTeachers(); showToast('تمت إضافة المعلم'); renderSettings();
}
function renderSchedGrid(){
  const id = +document.getElementById('schedSelect').value;
  const t = teachers.find(x=>x.id===id);
  if(!t) return;
  const grid = document.getElementById('schedGrid');
  let html = '<table><tr><th></th>' + [1,2,3,4,5,6,7,8].map(p=>`<th>${p}</th>`).join('') + '</tr>';
  DAYS.forEach((day,di)=>{
    html += `<tr><th>${day}</th>`;
    for(let p=0;p<8;p++){
      const v = t.sched[di][p]==='.' ? '' : t.sched[di][p];
      html += `<td><input type="text" data-d="${di}" data-p="${p}" value="${v}"></td>`;
    }
    html += '</tr>';
  });
  html += '</table>';
  grid.innerHTML = html;
}
function saveSchedGrid(){
  const id = +document.getElementById('schedSelect').value;
  const t = teachers.find(x=>x.id===id);
  if(!t) return;
  document.querySelectorAll('#schedGrid input').forEach(inp=>{
    const di = +inp.dataset.d, p = +inp.dataset.p;
    const val = inp.value.trim();
    t.sched[di][p] = val === '' ? '.' : val;
  });
  saveTeachers();
  showToast('تم حفظ جدول '+t.name+' بنجاح');
}

showTab('absence');
</script>
</body>
</html>
